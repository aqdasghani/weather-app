<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Weather App</h1>

    <input type="search" name="search" id="inputText" placeholder="Enter city name">
    <button id="searchBtn">Search</button>
    
    <div id="weatherData" style="display: none;">
        <p><strong>City:</strong> <span id="city"></span></p>

        <p><strong>Temperature:</strong> <span id="temperature"></span> °C</p>

        <p><strong>Humidity:</strong> <span id="humidity"></span> %</p>

        <p><strong>Feels Like:</strong> <span id="feelslike"></span> °C</p>

        <p><strong>Wind Speed:</strong> <span id="windspeed"></span> m/s</p>

        <p><strong>Description:</strong> <span id="description"></span></p>

        <p><strong>Country:</strong> <span id="country"></span></p>


        <img id="weatherIcon" alt="Weather Icon" />
      </div>
      
    

    <script src="script.js"></script>
</body>

</html>
